name: HAR source tests
on:
  push:
  pull_request:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-ci.txt
      - run: PYTHONPATH=src pytest -q tests/
      - name: Validate notebook source syntax
        run: |
          python -m pip install nbformat
          python - <<'PY'
          import ast, nbformat
          from pathlib import Path
          for notebook in Path('notebooks').glob('*.ipynb'):
              nb=nbformat.read(str(notebook), as_version=4)
              for cell in nb.cells:
                  if cell.cell_type == 'code':
                      src = '\n'.join(line for line in cell.source.splitlines() if not line.lstrip().startswith(('%', '!')))
                      ast.parse(src)
              print(f'Parsed notebook: {notebook}')
          PY
